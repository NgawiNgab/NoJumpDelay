name: Build

on:
  push:
    branches:
      - main
      - "arena/**"
      - "feat/**"
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Host tests + cross-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run host unit tests + full-source cross-check
        run: ./scripts/build_and_test.sh

  native:
    name: arm64-v8a build + levipack
    runs-on: ubuntu-latest
    needs: tests
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      # Runner images may not carry sdkmanager on PATH anymore — bootstrap
      # cmdline-tools from dl.google.com if needed, then install the NDK.
      - name: Bootstrap Android cmdline-tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools" || { echo "::error::mkdir failed"; exit 1; }
            curl -fsSL -o /tmp/clt.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              || { echo "::error::cmdline-tools download failed rc=$?"; exit 1; }
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools" \
              || { echo "::error::cmdline-tools unzip failed"; exit 1; }
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" \
              || { echo "::error::cmdline-tools layout fix failed"; exit 1; }
          fi
          echo "::notice::cmdline-tools ready at $SDKM"

      - name: Install Android NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$ANDROID_NDK_HOME/bin/clang++" ]; then
            yes | "$SDKM" --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358" > /dev/null \
              || { echo "::error::sdkmanager NDK install failed"; exit 1; }
          fi
          "$ANDROID_NDK_HOME/bin/clang++" --version \
            || { echo "::error::NDK clang++ missing"; exit 1; }

      - name: Build native lib + package
        run: ./scripts/build_and_test.sh --native

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApollonKillAura-1.26.60-levipack
          path: build/ApollonKillAura-1.26.60.levipack
