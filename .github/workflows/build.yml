name: Build

on:
  push:
    branches:
      - main
      - "arena/**"
      - "feat/**"
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Host tests + cross-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run host unit tests + full-source cross-check
        run: ./scripts/build_and_test.sh

  native:
    name: arm64-v8a build + levipack
    runs-on: ubuntu-latest
    needs: tests
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      # Runner images may not carry sdkmanager on PATH anymore — bootstrap
      # cmdline-tools from dl.google.com if needed, then install the NDK.
      - name: Bootstrap Android cmdline-tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools" || { echo "::error::mkdir failed"; exit 1; }
            curl -fsSL -o /tmp/clt.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              || { echo "::error::cmdline-tools download failed rc=$?"; exit 1; }
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools" \
              || { echo "::error::cmdline-tools unzip failed"; exit 1; }
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" \
              || { echo "::error::cmdline-tools layout fix failed"; exit 1; }
          fi
          echo "::notice::cmdline-tools ready at $SDKM"

      - name: Install Android NDK
        run: |
          NDK_ROOT=""
          # 1) Reuse a preinstalled NDK when present (fastest).
          if [ -d "$ANDROID_HOME/ndk" ]; then
            for v in $(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -3); do
              [ -x "$ANDROID_HOME/ndk/$v/bin/clang++" ] && NDK_ROOT="$ANDROID_HOME/ndk/$v" && break
            done
          fi
          # 2) Fall back to downloading r28b.
          if [ -z "$NDK_ROOT" ]; then
            NDK_ROOT="$ANDROID_HOME/android-ndk-r28b"
            curl -fsSL -o /tmp/ndk.zip \
              "https://dl.google.com/android/repository/android-ndk-r28b-linux.zip" \
              || { echo "::error::NDK download failed rc=$?"; exit 1; }
            df -h "$ANDROID_HOME" | tail -1 | sed 's/^/::notice::disk: /'
            python3 -c "import zipfile; z=zipfile.ZipFile('/tmp/ndk.zip'); ns=z.namelist(); print('::notice::zip-entries:', len(ns)); print('::notice::zip-bad:', z.testzip()); print('::notice::zip-clang:', sum(1 for n in ns if n.endswith('/bin/clang++')))"
            unzip -q /tmp/ndk.zip -d "$ANDROID_HOME" \
              || { echo "::error::NDK unzip failed"; exit 1; }
            rm -f /tmp/ndk.zip
            echo "::notice::extracted-files: $(find "$NDK_ROOT" -type f | wc -l)"
            ls "$NDK_ROOT/bin" >/dev/null 2>&1 \
              || echo "::error::NDK bin/ missing after extraction"
          fi
          [ -x "$NDK_ROOT/bin/clang++" ] || { echo "::error::NDK clang++ missing"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          "$NDK_ROOT/bin/clang++" --version

      - name: Build native lib + package
        run: ./scripts/build_and_test.sh --native

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApollonKillAura-1.26.60-levipack
          path: build/ApollonKillAura-1.26.60.levipack
