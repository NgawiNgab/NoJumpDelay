name: Kill Aura build and checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    name: Host model and research tests (no device artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch independent JSON dependency
        run: git clone --depth 1 --branch v3.11.3 https://github.com/nlohmann/json.git "$RUNNER_TEMP/nlohmann-json"
      - name: Run host tests with ASan and UBSan
        env:
          NLOHMANN_INCLUDE: ${{ runner.temp }}/nlohmann-json/single_include
        run: ./fresh-port/tests/run_host_tests.sh
      - name: Fetch independent preloader headers and fmt
        run: |
          git init "$RUNNER_TEMP/preloader"
          git -C "$RUNNER_TEMP/preloader" remote add origin https://github.com/LiteLDev/preloader-android.git
          git -C "$RUNNER_TEMP/preloader" fetch --depth 1 origin cc08b40a31471d3e2dedb267f5f17b28da2b0604
          git -C "$RUNNER_TEMP/preloader" checkout --detach FETCH_HEAD
          git clone --depth 1 --branch 11.2.0 https://github.com/fmtlib/fmt.git "$RUNNER_TEMP/fmt"
      - name: Compile against upstream SDK headers on host
        env:
          NLOHMANN_INCLUDE: ${{ runner.temp }}/nlohmann-json/single_include
          PRELOADER_SDK: ${{ runner.temp }}/preloader
          FMT_INCLUDE: ${{ runner.temp }}/fmt/include
        run: ./fresh-port/tests/run_sdk_compile.sh
  android:
    name: Android arm64 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned independent build dependencies
        run: |
          git init "$RUNNER_TEMP/preloader"
          git -C "$RUNNER_TEMP/preloader" remote add origin https://github.com/LiteLDev/preloader-android.git
          git -C "$RUNNER_TEMP/preloader" fetch --depth 1 origin cc08b40a31471d3e2dedb267f5f17b28da2b0604
          git -C "$RUNNER_TEMP/preloader" checkout --detach FETCH_HEAD
          git clone --depth 1 --branch 11.2.0 https://github.com/fmtlib/fmt.git "$RUNNER_TEMP/fmt"
          git clone --depth 1 --branch v3.11.3 https://github.com/nlohmann/json.git "$RUNNER_TEMP/nlohmann-json"
      - name: Select preinstalled Android NDK
        run: |
          NDK_ROOT=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
      - name: Build, verify and package
        env:
          PRELOADER_SDK: ${{ runner.temp }}/preloader
          FMT_INCLUDE: ${{ runner.temp }}/fmt/include
          NLOHMANN_INCLUDE: ${{ runner.temp }}/nlohmann-json/single_include
          BUILD_DIR: ${{ runner.temp }}/native
        run: ./fresh-port/scripts/build_native.sh
      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: ApollonKillAura-1.26.60.4
          path: ${{ runner.temp }}/native/ApollonKillAura-1.26.60.4.levipack
